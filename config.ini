; Configuration de la station sol - réseau réel
; Lancement :  python -m ssd --config config.ini

[reseau]
; Adresse et port du DPF (réseau bord 172.20.4.x, réponse CNES du 15/10/2026).
; Le numéro d'hôte et les ports sont une proposition à confirmer avec le groupe DPF.
adresse_dpf = 172.20.4.10
port_dpf = 5001
; Port UDP sur lequel la station sol reçoit les HK et les données.
port_ecoute = 5000
; Interface du PC à utiliser (0.0.0.0 = toutes). Le PC est sur le réseau sol 172.20.3.x.
adresse_locale = 0.0.0.0

[surveillance]
; Période des HK (EX-COM-120 : 60 s au plus) et nombre de périodes sans HK
; avant de déclarer la perte (EX-COM-130 : 3).
periode_hk_s = 60
seuil_perte = 3

[enregistrement]
; Dossier des fichiers produits (un sous-dossier par session).
dossier = enregistrements
