; Configuration de démonstration : station sol et simulateur sur le même PC
; Lancement :  python -m simulateur            (dans un premier terminal)
;              python -m ssd --config config_demo.ini

[reseau]
adresse_dpf = 127.0.0.1
port_dpf = 5001
port_ecoute = 5000
adresse_locale = 127.0.0.1

[surveillance]
; HK toutes les 5 s pour voir les pertes en 15 s (le simulateur émet aussi à 5 s).
periode_hk_s = 5
seuil_perte = 3

[enregistrement]
dossier = enregistrements
